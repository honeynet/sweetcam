[paths]
provisioning = /etc/grafana/provisioning

[server]
http_port = 3000
protocol = http

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db
busy_timeout = 5000
max_open_conn = 0
max_idle_conn = 2
conn_max_lifetime = 14400

[security]
admin_user = admin
admin_password = admin
allow_embedding = true
cookie_secure = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[log]
mode = console
level = info

[feature_toggles]
enable = publicDashboards
publicDashboards = true

[plugins]
allow_loading_unsigned_plugins = false
plugin_admin_enabled = false

[unified_alerting]
enabled = false

[alerting]
enabled = false

[metrics]
enabled = false

[snapshots]
external_enabled = false

[quota]
enabled = false

[datasources]
default_cache_ttl = 30s
query_cache_ttl = 30s

[datasources.mysql]
max_open_conns = 100
max_idle_conns = 10
conn_max_lifetime = 14400
query_timeout = 30s 