      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - PUBLIC_RTSP_HOST=${PUBLIC_RTSP_HOST:-localhost}
      # - RTSP_MEDIA_MODE=h264-prep
      # - RTSP_H264_UPSTREAM=rtsp://rtsp_h264_media:8554
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "8655:8554"
      - "8006:8002"
      - "8007:8003"
    volumes:
      - ./logs/rtspservices:/app/logs
    depends_on:
