volumes:
  cowrie-var:
    driver: local
  web-servie-log:
    driver: local
  rtsp-resource:
    driver: local

services:
  cowrie_service:
    image: cowrie/cowrie:latest
    container_name: cowrie-services
    restart: unless-stopped
    env_file: ./.env
    environment:
      - COWRIE_LOCAL_PORT=$COWRIE_LOCAL_PORT
      - COWRIE_DOCKER_PORT=$COWRIE_DOCKER_PORT
    ports:
      - ${COWRIE_LOCAL_PORT}:${COWRIE_DOCKER_PORT}
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var
  mysql_service:
    image: mysql:8.0.28
    container_name: mysql_service
    cap_add:
      - SYS_NICE
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=$MYSQLDB_ROOT_PASSWORD 
      - MYSQL_DATABASE=$MYSQLDB_DATABASE
    ports:
      - "3306:3306"
    volumes:
      - ./initialize.sql:/docker-entrypoint-initdb.d/initialize.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  web_service:
    container_name: web_service
    build: 
      context: ./webservices
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_HOST=mysql_service
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=sweetcam
      - DB_PORT=3306
    ports:
      - "80:80"
      - "37777:37777"
      - "443:443"
    stdin_open: true
    tty: true
    depends_on:
      mysql_service:
        condition: service_healthy
  rtsp_service:
    build: ./rtspservices
    container_name: rtsp_service
    restart: unless-stopped
    environment:
      - RTSP_LOCAL_PORT=554
      - RTSP_DOCKER_PORT=8554
      - MTX_PROTOCOLS=tcp
    ports:
      - "554:554"
    volumes:
      - ./videos:/app/rtsp/videos
      - rtsp-resource:/app/rtsp
  
