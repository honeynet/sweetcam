  rtsp_h264_publisher_hikvision_101:
    build:
      context: ./rtspservices
      dockerfile: Dockerfile
    container_name: rtsp_h264_publisher_hikvision_101_service
    restart: unless-stopped
    command:
      - ffmpeg
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /app/media/camera-loop-720p15.mp4
      - -an
      - -vf
      - format=yuv420p
      - -c:v
      - libx264
      - -preset
      - veryfast
      - -tune
      - zerolatency
      - -profile:v
      - baseline
      - -level
      - "3.1"
      - -r
      - "15"
      - -g
      - "30"
      - -keyint_min
      - "30"
      - -bf
      - "0"
      - -x264-params
      - repeat-headers=1:scenecut=0
      - -metadata
      - title=Hikvision DS-2CD3T52H2-K stream
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://rtsp_h264_media:8554/Streaming/Channels/101
    depends_on:
      - rtsp_h264_media

