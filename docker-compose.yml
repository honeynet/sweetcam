volumes:
  cowrie-var:
    driver: local
  web-servie-log:
    driver: local
  rtsp-resource:
    driver: local
  rtsp-logs:
    driver: local
  grafana-data:
    driver: local
  mysql-data:
    driver: local

services:
  cowrie_service:
    image: cowrie/cowrie:latest
    container_name: cowrie-services
    restart: unless-stopped
    env_file: ./.env
    environment:
      - COWRIE_LOCAL_PORT=$COWRIE_LOCAL_PORT
      - COWRIE_DOCKER_PORT=$COWRIE_DOCKER_PORT
    ports:
      - ${COWRIE_LOCAL_PORT}:${COWRIE_DOCKER_PORT}
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro

  mysql_service:
    image: mysql:8.0
    container_name: mysql_service
    cap_add:
      - SYS_NICE
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=$MYSQLDB_ROOT_PASSWORD 
      - MYSQL_DATABASE=$MYSQLDB_DATABASE
    ports:
      - "3306:3306"
    volumes:
      - ./initialize.sql:/docker-entrypoint-initdb.d/initialize.sql
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --max-connections=200 --max-connect-errors=1000 --wait-timeout=28800 --interactive-timeout=28800
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web_service:
    container_name: web_service
    build: 
      context: ./webservices
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./.env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - PUBLIC_RTSP_HOST=${PUBLIC_RTSP_HOST:-localhost}
      - ADMIN_PATH=admin
      - COWRIE_INGESTOR_ENABLED=true
      - COWRIE_CONTAINER_NAME=cowrie-services
      - COWRIE_LOG_PATH=/cowrie/cowrie-git/var/log/cowrie/cowrie.json
      - COWRIE_PY=python3
      - MEDIAMTX_PUBLIC_RTSP_PORT=8554
      - MEDIAMTX_HIKVISION_RTSP_PORT=8554
      - MEDIAMTX_DAHUA_RTSP_PORT=8555
      - MEDIAMTX_AXIS_RTSP_PORT=8556
      - MEDIAMTX_REOLINK_RTSP_PORT=8557
      - MEDIAMTX_MOBOTIX_RTSP_PORT=8558
      - MEDIAMTX_VSTARCAM_RTSP_PORT=8559
      - MEDIAMTX_FOSCAM_RTSP_PORT=8560
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./docker-compose.yml:/app/docker-compose.yml
      - ./logs:/app/logs
    depends_on:
      mysql_service:
        condition: service_healthy
      cowrie_service:
        condition: service_started
      grafana:
        condition: service_healthy

  #RTSP
  rtsp_main:
    build:
      context: ./rtspservices
      dockerfile: Dockerfile
    container_name: rtsp_main_service
    restart: unless-stopped
    env_file: ./.env
    environment:
      - REQUIRE_RTSP_AUTH=true
      - BRAND=auto
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - PUBLIC_RTSP_HOST=${PUBLIC_RTSP_HOST:-localhost}
      # Set RTSP_MEDIA_MODE=h264-prep to make Node advertise H.264 SDP
      # while leaving SETUP/PLAY disabled until redirect/proxy/hooks are chosen.
      # - RTSP_MEDIA_MODE=h264-prep
      # - RTSP_H264_UPSTREAM=rtsp://rtsp_h264_media:8554
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "554:554"
      - "8002:8002"
      - "8003:8003"
      - "8004:8004"
      - "8005:8005"
    volumes:
      - ./logs/rtspservices:/app/logs
    depends_on:
      mysql_service:
        condition: service_healthy

  
  rtsp_hikvision:
    build:
      context: ./rtspservices
      dockerfile: Dockerfile
