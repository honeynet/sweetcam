services:
  web_service:
    environment:
      - NO_AUTH_RTSP_BRANDS=axis
      - NO_AUTH_WEB_BRANDS=axis
      - PUBLIC_VIEWER_USERNAME=guest
      - PUBLIC_RTSP_HOST=${PUBLIC_RTSP_HOST:-${PUBLIC_IP:-localhost}}
      - ONVIF_PUBLIC_HOST=${ONVIF_PUBLIC_HOST:-${PUBLIC_IP:-localhost}}
      - PUBLIC_ONVIF_HOST=${PUBLIC_ONVIF_HOST:-${PUBLIC_IP:-localhost}}
      - MEDIAMTX_PUBLIC_RTSP_PORT=554
      - MEDIAMTX_AXIS_RTSP_PORT=554
    ports: !reset []

  mysql_service:
    ports: !reset []

  grafana:
    ports: !reset []

  cowrie_service:
    ports: !reset []

  rtsp_h264_media:
    ports: !override
      - "554:8554"

  axis_service:
    environment:
      - NO_AUTH_WEB_BRANDS=axis
      - PUBLIC_VIEWER_USERNAME=guest
      - PUBLIC_RTSP_HOST=${PUBLIC_RTSP_HOST:-${PUBLIC_IP:-localhost}}
      - MEDIAMTX_PUBLIC_RTSP_PORT=554
      - MEDIAMTX_AXIS_RTSP_PORT=554
    ports: !override
      - "80:10000"

  onvif_axis_service:
    environment:
      - ONVIF_HTTP_PORT=8080
      - PUBLIC_RTSP_HOST=${PUBLIC_RTSP_HOST:-${PUBLIC_IP:-localhost}}
      - ONVIF_PUBLIC_HOST=${ONVIF_PUBLIC_HOST:-${PUBLIC_IP:-localhost}}
      - PUBLIC_ONVIF_HOST=${PUBLIC_ONVIF_HOST:-${PUBLIC_IP:-localhost}}
      - MEDIAMTX_PUBLIC_RTSP_PORT=554
      - MEDIAMTX_AXIS_RTSP_PORT=554
    ports: !override
      - "3702:3702/udp"
      - "8080:8080"
